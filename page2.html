<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 집 기준 확정 노선 조회</title>
  <style>
    /* 기본 리셋 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 메인 카드 컨테이너 */
    .route-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* 상단 타이틀 */
    .title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* 주소 검색창 영역 */
    .search-box {
      display: flex;
      align-items: center;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      background-color: #ffffff;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .search-box:focus-within {
      border-color: #3b82f6;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 16px;
      font-size: 14px;
      color: #334155;
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .search-btn {
      background: none;
      border: none;
      border-left: 1px solid #e2e8f0;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-btn:hover {
      background-color: #f8fafc;
    }

    /* 안쪽 회색 배경 박스 */
    .info-container {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px 16px;
    }

    /* 서브 타이틀 */
    .sub-title {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    /* 영역 카드 리스트 */
    .zone-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 개별 구역 카드 공통 */
    .zone-card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-left-width: 4px; /* 왼쪽 두꺼운 포인트 라인 */
    }

    /* 구역별 왼쪽 포인트 컬러 */
    .zone-card.purple { border-left-color: #6366f1; }
    .zone-card.blue { border-left-color: #0284c7; }
    .zone-card.green { border-left-color: #10b981; }
    .zone-card.gray { border-left-color: #94a3b8; }

    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .zone-title {
      font-size: 14px;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 동그란 불릿 아이콘 */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.purple { background-color: #6366f1; }
    .dot.blue { background-color: #0284c7; }
    .dot.green { background-color: #10b981; }
    .dot.gray { background-color: #94a3b8; }

    /* 우측 거리 뱃지 */
    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .badge.purple { background-color: #e0e7ff; color: #4338ca; }
    .badge.blue { background-color: #e0f2fe; color: #0369a1; }
    .badge.green { background-color: #dcfce7; color: #15803d; }
    .badge.gray { background-color: #f1f5f9; color: #475569; }

    /* 구역 설명 */
    .zone-desc {
      font-size: 12px;
      color: #64748b;
      padding-left: 14px;
      line-height: 1.4;
    }

    /* 하단 각주 */
    .notice {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="route-card">
    <!-- 상단 제목 -->
    <div class="title">
      🔍 우리 집 기준 확정 노선 조회
    </div>

    <!-- 주소 검색 입력창 -->
    <div class="search-box">
      <input type="text" class="search-input" placeholder="여기를 터치하여 집 주소를 검색하세요">
      <button class="search-btn" onclick="onSearch()">검색</button>
    </div>

    <!-- 하단 보상 및 지원 구역 안내 박스 -->
    <div class="info-container">
      <div class="sub-title">
        ⚖️ 송주법(345kV 기준) 보상 및 지원 구역 안내
      </div>

      <div class="zone-list">
        <!-- 재산적 보상지역 -->
        <div class="zone-card purple">
          <div class="zone-header">
            <span class="zone-title">
              <span class="dot purple"></span> 재산적 보상지역
            </span>
            <span class="badge purple">~13m 이내</span>
          </div>
          <div class="zone-desc">토지 소유자에 대한 재산선상 손실보상 대상</div>
        </div>

        <!-- 주택매수 등 청구지역 -->
        <div class="zone-card blue">
          <div class="zone-header">
            <span class="zone-title">
              <span class="dot blue"></span> 주택매수 등 청구지역
            </span>
            <span class="badge blue">14m~60m</span>
          </div>
          <div class="zone-desc">주택·대지 매수 청구 및 주거환경 개선 지원</div>
        </div>

        <!-- 주변지역 지원사업 대상 -->
        <div class="zone-card green">
          <div class="zone-header">
            <span class="zone-title">
              <span class="dot green"></span> 주변지역 지원사업 대상
            </span>
            <span class="badge green">61m~700m</span>
          </div>
          <div class="zone-desc">전기요금 보조 및 주민지원·복지사업</div>
        </div>

        <!-- 지원 범위 외 -->
        <div class="zone-card gray">
          <div class="zone-header">
            <span class="zone-title">
              <span class="dot gray"></span> 지원 범위 외
            </span>
            <span class="badge gray">700m 초과</span>
          </div>
          <div class="zone-desc">송주법상 법정 보상 및 지원 대상 제외</div>
        </div>
      </div>

      <!-- 하단 안구 안내 문구 -->
      <div class="notice">
        * 최외측 선선 평면 직선거리 기준 (본 사업은 345kV 송선선로 법정 기준이 적용됩니다)
      </div>
    </div>
  </div>

  <script>
    function onSearch() {
      const query = document.querySelector('.search-input').value;
      if (!query.trim()) {
        alert('집 주소를 입력해주세요.');
        return;
      }
      alert(`'${query}' 주소로 노선을 조회합니다.`);
    }
  </script>
</body>
</html>
