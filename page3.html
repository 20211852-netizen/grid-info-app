<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송전선로 최단 거리 조회</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; cursor: pointer; }
        button { padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .result-card { background-color: #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .result-card h3 { color: #495057; font-size: 15px; margin-bottom: 5px; }
        .result-card .distance { font-size: 22px; font-weight: bold; color: #d9534f; margin-top: 5px; }
        #map { width: 100%; height: 500px; border-radius: 6px; border: 1px solid #ddd; }
    </style>

    <!-- 1. 카카오 우편번호 서비스 -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <!-- 2. 카카오맵 SDK (services 라이브러리 포함) -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=46cabf2ecf6483d3a12221f2ee95137b&libraries=services"></script>
    <!-- 3. Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <h2>송전선로 최단 거리 조회</h2>
        
        <div class="search-box">
            <input type="text" id="address-input" placeholder="주소를 검색하려면 클릭하세요" readonly onclick="openPostcode()">
            <button onclick="openPostcode()">주소 검색</button>
        </div>

        <div id="result-card" class="result-card">
            <h3>조회 주소: <span id="searched-address">-</span></h3>
            <div>송전선로와의 예상 최단 거리: <span id="distance-value" class="distance">- m</span></div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        // 1. Firebase 초기화
        const firebaseConfig = {
            apiKey: "AIzaSyA96a9K8qHnrkPNXDuHX8QnjqMM1FIEPY4",
            authDomain: "grid-info-app.firebaseapp.com",
            databaseURL: "https://grid-info-app-default-rtdb.firebaseio.com",
            projectId: "grid-info-app",
            storageBucket: "grid-info-app.firebasestorage.app",
            messagingSenderId: "541941822785",
            appId: "1:541941822785:web:8d91b8e0e343fc74bb9dc0",
            measurementId: "G-B3XS545L7R"
        };
        firebase.initializeApp(firebaseConfig);

        // 2. 카카오 지도 및 전역 객체 생성
        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 5
        };
        const map = new kakao.maps.Map(mapContainer, mapOption);
        const geocoder = new kakao.maps.services.Geocoder();

        let activePolyline = null;
        let powerLineCoords = [];
        let houseMarker = null;

        // 3. DB에서 저장된 송전선로 불러오기 (실시간 반영)
        firebase.database().ref('powerline').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            powerLineCoords = data.map(pt => new kakao.maps.LatLng(pt.lat, pt.lng));

            if (activePolyline) activePolyline.setMap(null);
            
            activePolyline = new kakao.maps.Polyline({
                path: powerLineCoords,
                strokeWeight: 5,
                strokeColor: '#FF0000',
                strokeStyle: 'dashed'
            });
            activePolyline.setMap(map);

            // 주소 검색 전이면 전체 송전선이 보이도록 영역 자동 조정
            if (powerLineCoords.length > 0 && !houseMarker) {
                const bounds = new kakao.maps.LatLngBounds();
                powerLineCoords.forEach(coord => bounds.extend(coord));
                map.setBounds(bounds);
            }
        });

        // 4. 주소 검색 팝업 호출
        function openPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    const addr = data.address;
                    document.getElementById('address-input').value = addr;
                    document.getElementById('searched-address').innerText = addr;

                    // 주소를 좌표로 변환
                    geocoder.addressSearch(addr, function(result, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            const houseLatLng = new kakao.maps.LatLng(result[0].y, result[0].x);

                            // 집 위치 마커 찍기
                            if (houseMarker) houseMarker.setMap(null);
                            houseMarker = new kakao.maps.Marker({
                                position: houseLatLng,
                                map: map
                            });

                            // 지도 이동
                            map.setCenter(houseLatLng);
                            map.setLevel(4);

                            // 수직 최단거리 계산 및 결과 출력
                            const minDistance = getMinDistanceToLine(houseLatLng);
                            document.getElementById('distance-value').innerText = minDistance.toLocaleString() + " m";
                            document.getElementById('result-card').style.display = "block";
                        }
                    });
                }
            }).open();
        }

        // 5. 점(집 위치)과 선분(송전선) 간 수직 최단 거리 계산
        function getMinDistanceToLine(houseLatLng) {
            if (powerLineCoords.length < 2) return 0;

            let minDistance = Infinity;

            for (let i = 0; i < powerLineCoords.length - 1; i++) {
                const A = powerLineCoords[i];
                const B = powerLineCoords[i + 1];
                const P = houseLatLng;

                const dx = B.getLng() - A.getLng();
                const dy = B.getLat() - A.getLat();
                
                let t = ((P.getLng() - A.getLng()) * dx + (P.getLat() - A.getLat()) * dy) / (dx * dx + dy * dy);
                t = Math.max(0, Math.min(1, t));

                const nearestPoint = new kakao.maps.LatLng(A.getLat() + t * dy, A.getLng() + t * dx);
                const segDist = new kakao.maps.Polyline({ path: [P, nearestPoint] }).getLength();
                
                if (segDist < minDistance) minDistance = segDist;
            }

            return Math.round(minDistance);
        }
    </script>
</body>
</html>
